name: "Failed Build Issue"
description: "Create or comment on an issue when your GitHub Actions workflow fails."
inputs:
  github-token:
    description: "GitHub token with repository access. Defaults to the workflow's automatic GITHUB_TOKEN."
    required: false
    default: ${{ github.token }}
  label-name:
    description: "Name of label that this action interacts with"
    required: false
    default: "build failed"
  title-template:
    description: "Mustache template to use as title when creating a new issue"
    required: false
    default: "Failed build: {{workflow}}"
  body-template:
    description: "Mustache template to use for issue or comment body"
    required: false
    default: |
      GitHub Actions workflow [{{workflow}} #{{runNumber}}]({{serverUrl}}/{{repo.owner}}/{{repo.repo}}/actions/runs/{{runId}}) failed.

      Event: {{eventName}}
      Branch: [{{refName}}]({{refUrl}})
      Commit: [{{sha}}]({{serverUrl}}/{{repo.owner}}/{{repo.repo}}/commit/{{sha}})

      <sup><i>Created by [jayqi/failed-build-issue-action](https://github.com/jayqi/failed-build-issue-action)</i></sup>
  create-label:
    description: "Whether to create a new label for 'label-name' if it doesn't already exist."
    required: false
    default: true
  always-create-new-issue:
    description: "If true, will always create a new issue, even if one matching 'label-name' is already open."
    required: false
    default: false
  label-color:
    description: "Color of the label to create if 'label-name' doesn't already exist."
    required: false
    default: "B60205"
  label-description:
    description: "Description for the label to create if 'label-name' doesn't already exist."
    required: false
# outputs will be available to future steps
outputs:
  issue-number:
    description: "Issue number of new issue or comment"
  html-url:
    description: "URL to new issue or comment on GitHub.com web app"
runs:
  using: "node24"
  main: "dist/index.js"
branding:
  icon: "alert-circle"
  color: "green"
