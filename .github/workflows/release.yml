name: release

on:
  release:
    types: [published]

jobs:
  move-major-tag:
    name: Move major version tag
    # dist/ is committed to the repo, so the released tag is already runnable;
    # this workflow only needs to float the major version tag (e.g. v1) forward.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move major version tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          MAJOR="${TAG%%.*}"          # v1.2.3 -> v1
          git tag -f "$MAJOR" "$TAG"
          git push origin -f "refs/tags/$MAJOR"
