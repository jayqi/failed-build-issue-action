name: "test-local"
on:
  workflow_dispatch:

jobs:
  tests:
    name: Test action from local source
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: npm

    - name: Install dependencies
      run: |
        npm ci

    - name: Build package
      run: |
        npm run build

    - name: Run action from local source
      uses: ./
