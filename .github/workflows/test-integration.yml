name: "test-integration"
on:
  workflow_dispatch:

permissions: {}

jobs:
  tests:
    name: Integration test with GitHub
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        cache: npm

    - name: Install dependencies
      run: |
        npm ci

    - name: Build package
      run: |
        npm run build

    - name: Run action from local source
      id: run-action
      uses: ./
      with:
        label-name: "integration test"

    - name: Verify action commented on evergreen issue
      env:
        ISSUE_NUMBER: ${{ steps.run-action.outputs.issue-number }}
        HTML_URL: ${{ steps.run-action.outputs.html-url }}
      run: |
        echo "issue-number: $ISSUE_NUMBER"
        echo "html-url: $HTML_URL"
        test "$ISSUE_NUMBER" = "105"
        case "$HTML_URL" in */issues/105#issuecomment-*) ;; *) exit 1 ;; esac
